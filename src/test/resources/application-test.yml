spring:
  main:
    allow-bean-definition-overriding: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true

  datasource:
    driver-class-name: org.postgresql.Driver

log:
  performance:
    enable: true
    # pointcut-expression: ""
    do-not-write-to-log-methods-whose-execution-time-is-less-than-X-ms: 0
    write-query-values:
      enable: true

  cache:
    enable: true
    method:
      pointcut-expression: "@annotation(org.springframework.cache.annotation.Cacheable)"
