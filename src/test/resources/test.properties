spring.main.allow-bean-definition-overriding=true

#JPA
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#JPA_LOG
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

log.performance.enable=true
#log.performance.pointcut-expression=
log.performance.do-not-write-to-log-methods-whose-execution-time-is-less-than-X-ms=0
log.performance.write-query-values.enable=true

log.cache.enable=true
log.cache.method.pointcut-expression=@annotation(org.springframework.cache.annotation.Cacheable)