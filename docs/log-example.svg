<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310"
     role="img" aria-label="Пример лога PerformanceLog">
  <defs>
    <clipPath id="window">
      <rect x="0" y="0" width="1200" height="310" rx="10"/>
    </clipPath>
    <style>
      text {
        font-family: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
        font-size: 11.5px;
      }
      .msg   { fill: #e6edf3; }
      .dim   { fill: #8b949e; }
      .faint { fill: #484f58; }
      .time  { fill: #6e7681; }
      .lvl   { fill: #3fb950; font-weight: bold; }
      .num   { fill: #f0883e; }
      .path  { fill: #79c0ff; }
      .sql   { fill: #a5d6ff; }
      .cnt   { fill: #d2a8ff; }
      .title { fill: #8b949e; font-size: 11px; }
    </style>
  </defs>

  <g clip-path="url(#window)">
    <rect width="1200" height="310" fill="#0d1117"/>
    <rect width="1200" height="34" fill="#161b22"/>
    <line x1="0" y1="34.5" x2="1200" y2="34.5" stroke="#30363d"/>

    <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
    <circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
    <circle cx="60" cy="17" r="6" fill="#27c93f"/>

    <text class="title" x="600" y="21" text-anchor="middle">logs/app.log — PerformanceLog (DEBUG)</text>

    <text xml:space="preserve" x="20" y="62"><tspan class="time">2026-11-22 14:32:07.481 </tspan><tspan
        class="lvl">DEBUG</tspan><tspan class="faint"> 12345 --- </tspan><tspan class="dim">[nio-8080-exec-1]</tspan><tspan
        class="faint"> </tspan><tspan class="path">c.c.a.i.l.p.a.PerformanceLogAspect</tspan><tspan
        class="faint"> : </tspan><tspan class="msg">method execution time: [</tspan><tspan class="num">183</tspan><tspan
        class="msg">] ms, return slice, size: [</tspan><tspan class="num">20</tspan><tspan class="msg">],</tspan></text>

    <text xml:space="preserve" x="20" y="84"><tspan class="msg">source: [</tspan><tspan
        class="path">com.company.app.user.UserService.findActive#1</tspan><tspan class="msg">], query info:</tspan></text>

    <text xml:space="preserve" x="20" y="106"><tspan class="msg">onPrepareStatement: total: [</tspan><tspan
        class="num">2</tspan><tspan class="msg">] (of them: select: [</tspan><tspan class="num">2</tspan><tspan
        class="msg">], update: [</tspan><tspan class="num">0</tspan><tspan class="msg">], insert: [</tspan><tspan
        class="num">0</tspan><tspan class="msg">]), sql:</tspan></text>

    <text xml:space="preserve" x="20" y="128"><tspan class="cnt">x2 </tspan><tspan
        class="sql">select u1_0.id, u1_0.name, u1_0.email from users u1_0 where u1_0.id in (?, ?)</tspan></text>

    <text xml:space="preserve" x="20" y="150"><tspan class="msg">onLoad: total: [</tspan><tspan
        class="num">2</tspan><tspan class="msg">], types:</tspan></text>

    <text xml:space="preserve" x="20" y="172"><tspan class="cnt">x2 </tspan><tspan
        class="sql">com.company.app.user.User</tspan></text>

    <text xml:space="preserve" x="20" y="194"><tspan class="msg">sql with values:</tspan></text>

    <text xml:space="preserve" x="20" y="216"><tspan class="dim">[2026-11-22T14:32:07.481] execution time [</tspan><tspan
        class="num">12</tspan><tspan class="dim">] ms, real sql:</tspan></text>

    <text xml:space="preserve" x="20" y="238"><tspan
        class="faint">HikariProxyPreparedStatement@230035651 wrapping </tspan><tspan
        class="sql">select u1_0.id, u1_0.name from users u1_0 where u1_0.id in (1, 2)</tspan></text>

    <text xml:space="preserve" x="20" y="260"><tspan class="dim">[2026-11-22T14:32:07.492] execution time [</tspan><tspan
        class="num">11</tspan><tspan class="dim">] ms, real sql:</tspan></text>

    <text xml:space="preserve" x="20" y="282"><tspan
        class="faint">HikariProxyPreparedStatement@966443427 wrapping </tspan><tspan
        class="sql">select u1_0.id, u1_0.name from users u1_0 where u1_0.id in (3, 4)</tspan></text>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="309" rx="10" fill="none" stroke="#30363d"/>
</svg>
