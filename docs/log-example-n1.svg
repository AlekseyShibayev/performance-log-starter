<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320"
     role="img" aria-label="Пример лога PerformanceLog — N+1">
  <defs>
    <clipPath id="box">
      <rect x="0" y="0" width="900" height="320" rx="10"/>
    </clipPath>
    <style>
      text {
        font-family: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
        font-size: 18px;
      }
      .msg   { fill: #e6edf3; }
      .faint { fill: #484f58; }
      .num   { fill: #f0883e; }
      .path  { fill: #79c0ff; }
      .sql   { fill: #a5d6ff; }
      .cnt   { fill: #d2a8ff; }
      .warn  { fill: #d29922; font-weight: bold; }
    </style>
  </defs>

  <g clip-path="url(#box)">
    <rect width="900" height="320" fill="#0d1117"/>

    <text xml:space="preserve" x="20" y="40"><tspan
        class="msg">method execution time: [</tspan><tspan class="num">1480</tspan><tspan
        class="msg">] ms, return collection, size: [</tspan><tspan class="num">10</tspan><tspan class="msg">],</tspan></text>

    <text xml:space="preserve" x="20" y="76"><tspan class="msg">source: [</tspan><tspan
        class="path">UserService.findAllWithOrders#1</tspan><tspan class="msg">], query info:</tspan></text>

    <text xml:space="preserve" x="20" y="112"><tspan class="msg">onPrepareStatement: total: [</tspan><tspan
        class="num">11</tspan><tspan class="msg">] (select: [</tspan><tspan class="num">11</tspan><tspan
        class="msg">]), sql:</tspan></text>

    <text xml:space="preserve" x="20" y="148"><tspan class="cnt">x1  </tspan><tspan
        class="sql">select u1_0.id, u1_0.name, u1_0.email from users u1_0</tspan></text>

    <rect x="14" y="156" width="872" height="36" rx="4" fill="#3a2d12"/>
    <rect x="14" y="156" width="4" height="36" fill="#d29922"/>
    <text xml:space="preserve" x="20" y="184"><tspan class="cnt">x10 </tspan><tspan
        class="sql">select o1_0.id, o1_0.amount from orders o1_0 where o1_0.user_id = ?</tspan></text>
    <text xml:space="preserve" x="790" y="184"><tspan class="warn">← N+1</tspan></text>

    <text xml:space="preserve" x="20" y="220"><tspan class="msg">onLoad: total: [</tspan><tspan
        class="num">110</tspan><tspan class="msg">], types:</tspan></text>

    <text xml:space="preserve" x="20" y="256"><tspan class="cnt">x10  </tspan><tspan
        class="sql">User</tspan></text>

    <text xml:space="preserve" x="20" y="292"><tspan class="cnt">x100 </tspan><tspan
        class="sql">Order</tspan></text>
  </g>

  <rect x="0.5" y="0.5" width="899" height="319" rx="10" fill="none" stroke="#30363d"/>
</svg>
